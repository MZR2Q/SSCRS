<!doctype html><html lang="en"><head><meta charset="utf-8"><title>7</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=Instrument+Serif:ital@0;1&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}img{display:block;max-width:100%}a{color:inherit;text-decoration:none}ul{list-style:none}
:root{--paper:#F1EFE9;--ink:#111214;--navy:#1B4C93;--green:#2E6B22;--rule:#111214;--mute:#6B6E75}
html,body{background:var(--paper);color:var(--ink);font-family:Archivo,sans-serif;min-height:100%}
.ar{font-family:"Noto Naskh Arabic";direction:rtl}
.ser{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;padding:0 28px;border-bottom:2px solid var(--rule);font-size:13px;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.bar .l{display:flex;gap:22px}.bar .l a.on{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.bar .c{font-weight:800;font-size:15px;letter-spacing:.08em}
.bar .r{display:flex;gap:22px;justify-content:flex-end}
.bar .r .cta{background:var(--ink);color:var(--paper);padding:7px 12px}
.ticker{height:40px;border-bottom:2px solid var(--rule);display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.ticker span{padding:0 28px;border-right:2px solid var(--rule)}
.hero{padding:40px 28px 28px;border-bottom:2px solid var(--rule);position:relative;min-height:calc(100vh - 98px)}
.hero .eyebrow{display:flex;justify-content:space-between;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:26px}
.hero h1{font-weight:900;font-size:184px;line-height:.86;letter-spacing:-.045em;text-transform:uppercase}
.hero h1 .ser{text-transform:none;font-size:160px;letter-spacing:-.02em;color:var(--navy)}
.hero .foot{position:absolute;left:28px;right:28px;bottom:26px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:40px;align-items:end;font-size:14px}
.hero .foot p{max-width:40ch;line-height:1.5}
.hero .foot .ar{font-size:22px;text-align:left}
.hero .foot .seal{width:96px;justify-self:end}
.btn{display:inline-block;border:2px solid var(--ink);padding:12px 18px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.btn.f{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);border-bottom:2px solid var(--rule)}
.cell{padding:22px 24px;border-right:1px solid var(--rule)}
.cell:last-child{border-right:0}
.no{font-size:12px;font-weight:600;letter-spacing:.08em;margin-bottom:14px;color:var(--mute)}
.cell h4{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.cell p{font-size:14px;line-height:1.5;color:#3A3D44}
.ph{padding:40px 28px 10px;border-bottom:2px solid var(--rule);display:grid;grid-template-columns:1fr auto;align-items:end;gap:40px}
.ph h1{font-weight:900;font-size:150px;line-height:.86;letter-spacing:-.045em;text-transform:uppercase}
.ph .idx{font-size:13px;text-transform:uppercase;font-weight:600;letter-spacing:.06em;padding-bottom:14px}
.ph .idx b{display:block;font-size:64px;line-height:1;font-weight:900;letter-spacing:-.04em}
.row{display:grid;grid-template-columns:80px 1fr 1fr 180px;gap:24px;align-items:center;padding:20px 28px;border-bottom:1px solid var(--rule);font-size:15px}
.row .n{font-weight:900;font-size:26px;letter-spacing:-.03em}
.row h4{font-size:22px;font-weight:600;letter-spacing:-.01em}
.row .m{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.row img{width:180px;aspect-ratio:1;object-fit:cover;object-position:top;filter:grayscale(1) contrast(1.05)}
.chairrow{grid-template-columns:80px 420px 1fr;padding:0 28px 0 28px;border-bottom:2px solid var(--rule)}
.chairrow img{width:420px;aspect-ratio:1/1.05;object-fit:cover;object-position:top;filter:grayscale(1) contrast(1.05);border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.chairrow .b{padding:30px 0 30px 30px}
.chairrow h2{font-weight:900;font-size:64px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase;margin:8px 0 12px}
.chairrow p{font-size:16px;line-height:1.5;max-width:52ch;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:2px solid var(--rule)}
.stats div{padding:26px 24px;border-right:1px solid var(--rule)}.stats div:last-child{border-right:0}
.stats b{display:block;font-weight:900;font-size:96px;line-height:.9;letter-spacing:-.05em}.stats span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--rule)}
.tier{padding:30px 28px;border-right:1px solid var(--rule)}.tier:last-child{border-right:0}
.tier.hl{background:var(--ink);color:var(--paper)}
.tier .no{color:inherit;opacity:.6}
.tier h3{font-weight:900;font-size:56px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase}
.tier .pr{font-size:28px;margin:18px 0 4px;font-weight:600;letter-spacing:-.02em}.tier .per{font-size:13px;opacity:.7;margin-bottom:20px}
.tier li{font-size:15px;padding:9px 0;border-top:1px solid currentColor}
.docrow{display:grid;grid-template-columns:80px 1fr 120px 120px;padding:18px 28px;border-bottom:1px solid var(--rule);align-items:center;font-size:17px}
.docrow .n{font-weight:900;font-size:22px;letter-spacing:-.03em}.docrow .m{font-size:13px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.about{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--rule)}
.about>div{padding:34px 28px}.about>div:first-child{border-right:1px solid var(--rule)}
.about p.big{font-size:34px;line-height:1.15;letter-spacing:-.02em;font-weight:500}
.about img{width:300px;margin:0 auto;filter:grayscale(1) contrast(1.1)}
</style></head><body>
<div class="bar"><div class="l"><a id="n-about">About</a><a id="n-board">Board</a><a id="n-membership">Membership</a><a id="n-committees">Committees</a><a>Education</a></div><div class="c">SSCRS</div><div class="r"><a class="ar">العربية</a><a>Login</a><a class="cta">Join</a></div></div>
<div class="ticker"><span>Annual Forum 2026 — 15–17 April — Riyadh</span><span>Registration open</span><span>New screening guidelines published</span><span>Fellowship applications 2026</span><span>Colorectal Cancer Awareness Month</span><span>Annual Forum 2026 — 15–17 April — Riyadh</span><span>Registration open</span></div>
<main id="m"></main>
<script>
const D=window.D,P=window.PAGE;const n=document.querySelector('#n-'+P);if(n)n.classList.add('on');
const T={
home:`<section class="hero"><div class="eyebrow"><span>Saudi Society of Colon &amp; Rectal Surgery</span><span>Est. 2009 · 1430H</span><span>Riyadh, KSA</span></div>
<h1>Colon<br>&amp; Rectal<br><span class="ser">surgery,</span> KSA</h1>
<div class="foot"><p>The national home for colorectal surgical excellence — education, research and public awareness across the Kingdom.</p><div class="ar">الجمعية السعودية لجراحة القولون والمستقيم</div><div><a class="btn f">Become a member</a> <a class="btn">About</a></div><img class="seal" src="assets/seal.png"></div></section>
<div class="grid"><div class="cell" style="grid-column:span 3"><div class="no">01 — FORUM</div><h4>Annual Forum 2026</h4><p>The Kingdom's premier colorectal gathering. 15–17 April.</p></div><div class="cell" style="grid-column:span 3"><div class="no">02 — MEMBERSHIP</div><h4>Three categories</h4><p>Affiliate, regular and honorary.</p></div><div class="cell" style="grid-column:span 3"><div class="no">03 — EDUCATION</div><h4>CME &amp; fellowship</h4><p>Accredited courses and workshops.</p></div><div class="cell" style="grid-column:span 3"><div class="no">04 — GOVERNANCE</div><h4>Committees</h4><p>Bylaws, regulations and forms.</p></div></div>`,
board:`<div class="ph"><h1>Board</h1><div class="idx">Members<b>08</b></div></div>
<div class="row chairrow"><div class="n">01</div><img src="${D.members[0].img}"><div class="b"><div class="m">${D.members[0].r}</div><h2>${D.members[0].n.replace('Prof. ','')}</h2><p>${D.members[0].bio}</p><div class="m">${D.members[0].i}</div></div></div>
${D.members.slice(1).map((m,i)=>`<div class="row"><div class="n">0${i+2}</div><div><h4>${m.n}</h4><div class="m">${m.t}</div></div><div class="m">${m.i}</div><img src="${m.img}"></div>`).join('')}`,
about:`<div class="ph"><h1>About</h1><div class="idx">Since<b>2009</b></div></div>
<div class="about"><div><p class="big">Founded by decree of the Saudi Commission for Health Specialties to organize scientific work, strengthen fellowship, and raise public awareness of colorectal health.</p></div><div><img src="assets/seal.png"></div></div>
<div class="stats">${D.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
<div class="grid">${D.pillars.map((p,i)=>`<div class="cell" style="grid-column:span 3"><div class="no">0${i+1}</div><h4>${p[0]}</h4></div>`).join('')}</div>`,
membership:`<div class="ph"><h1>Join</h1><div class="idx">Categories<b>03</b></div></div>
<div class="tiers">${D.tiers.map((t,i)=>`<div class="tier${i==1?' hl':''}"><div class="no">0${i+1}</div><h3>${t[0]}</h3><div class="pr">${t[2]}</div><div class="per">${t[3]}</div><ul>${t[4].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`,
committees:`<div class="ph"><h1>Rules</h1><div class="idx">Committees<b>06</b></div></div>
${D.coms.map((c,i)=>`<div class="row" style="grid-template-columns:80px 1.2fr 1fr 1fr"><div class="n">0${i+1}</div><h4>${c[0]}</h4><div class="m">${c[2]}</div><div style="font-size:14px">${c[3]}</div></div>`).join('')}
<div class="ph" style="padding-top:34px"><h1 style="font-size:96px">Documents</h1><div class="idx">PDF<b>05</b></div></div>
${D.docs.map((d,i)=>`<div class="docrow"><div class="n">0${i+1}</div><div>${d[0]}</div><div class="m">${d[2]}</div><div class="m">Download ↓</div></div>`).join('')}`};
document.querySelector('#m').innerHTML=T[P];
</script></body></html>
