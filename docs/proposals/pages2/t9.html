<!doctype html><html lang="en"><head><meta charset="utf-8"><title>9</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}img{display:block;max-width:100%}a{color:inherit;text-decoration:none}ul{list-style:none}
:root{--deep:#0B2444;--navy:#1B4C93;--green:#4E9E37;--paper:#FBFAF7;--ink:#141A24;--mute:#707886;--line:#E6E3DB}
html,body{background:var(--paper);color:var(--ink);font-family:Inter,sans-serif;min-height:100%}
.ar{font-family:"Noto Naskh Arabic";direction:rtl}
.fr{font-family:Fraunces,serif;font-weight:300;letter-spacing:-.02em}
.left{position:fixed;top:0;bottom:0;left:0;width:42vw;background:var(--deep);color:#fff;padding:40px 44px;display:flex;flex-direction:column;justify-content:space-between}
.left .lock{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;color:rgba(255,255,255,.75)}
.left .lock img{width:44px;height:44px;border-radius:50%;background:#fff;padding:2px}
.vnav{display:flex;flex-direction:column;gap:6px}
.vnav a{font-family:Fraunces,serif;font-weight:300;font-size:46px;line-height:1.12;color:rgba(255,255,255,.42);letter-spacing:-.02em;display:flex;align-items:baseline;gap:14px}
.vnav a i{font-family:Inter;font-style:normal;font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.35)}
.vnav a.on{color:#fff}.vnav a.on i{color:var(--green)}
.left .bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:12.5px;color:rgba(255,255,255,.55)}
.left .bot .ar{font-size:18px;color:#fff}
.left .title{font-family:Fraunces,serif;font-weight:300;font-size:72px;line-height:.98;letter-spacing:-.03em;max-width:9ch}
.left .title small{display:block;font-family:Inter;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin-bottom:22px;font-weight:600}
.right{margin-left:42vw;min-height:100vh;padding:40px 56px 60px}
.util{display:flex;justify-content:flex-end;gap:22px;font-size:13.5px;color:var(--mute);margin-bottom:60px}
.util .cta{color:var(--ink);font-weight:600;border-bottom:1.5px solid var(--ink)}
.hero h1{font-family:Fraunces,serif;font-weight:300;font-size:60px;line-height:1.05;letter-spacing:-.025em;max-width:16ch}
.hero p{font-size:17px;color:var(--mute);max-width:52ch;margin:22px 0 30px;line-height:1.65}
.btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:4px;background:var(--ink);color:#fff;font-weight:600;font-size:14.5px}
.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}
.entries{margin-top:64px;border-top:1px solid var(--line)}
.e{display:grid;grid-template-columns:120px 1fr auto;gap:30px;padding:26px 0;border-bottom:1px solid var(--line);align-items:baseline}
.e .d{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.e h4{font-family:Fraunces,serif;font-weight:400;font-size:26px;letter-spacing:-.01em}
.e p{font-size:14.5px;color:var(--mute);margin-top:6px}
.e .a{font-size:14px;font-weight:600}
.ph{margin-bottom:40px}.ph p{font-size:18px;color:var(--mute);max-width:50ch;line-height:1.6}
.chair{display:grid;grid-template-columns:260px 1fr;gap:36px;align-items:end;padding-bottom:40px;border-bottom:1px solid var(--line)}
.chair img{aspect-ratio:4/5;object-fit:cover;object-position:top}
.chair .r{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:600}
.chair h2{font-family:Fraunces,serif;font-weight:300;font-size:50px;letter-spacing:-.025em;margin:8px 0 10px;line-height:1}
.chair p{font-size:15px;color:var(--mute);line-height:1.6;max-width:50ch}
.mem{display:grid;grid-template-columns:140px 1fr auto;gap:30px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}
.mem img{aspect-ratio:1;object-fit:cover;object-position:top}
.mem h4{font-family:Fraunces,serif;font-weight:400;font-size:26px}.mem .t{font-size:14px;color:var(--mute);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin:40px 0;padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats b{display:block;font-family:Fraunces,serif;font-weight:300;font-size:48px;letter-spacing:-.03em;line-height:1}.stats span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.tier{padding:28px 24px 28px 0;border-right:1px solid var(--line);margin-right:24px}.tier:last-child{border:0}
.tier h3{font-family:Fraunces,serif;font-weight:400;font-size:30px}.tier .pr{font-family:Fraunces,serif;font-weight:300;font-size:44px;margin:14px 0 2px;letter-spacing:-.03em}.tier .per{font-size:13px;color:var(--mute);margin-bottom:18px}
.tier li{font-size:14.5px;padding:8px 0;border-top:1px solid var(--line);color:#3A4150}
.tier.hl h3:after{content:" · recommended";font-family:Inter;font-size:12px;color:var(--green);font-weight:600}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.about img{width:260px;margin:0 auto}
.pill{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.pill div{padding:16px 0;border-top:1px solid var(--line);font-family:Fraunces,serif;font-size:22px;font-weight:400}
</style></head><body>
<aside class="left" id="L"></aside>
<div class="right"><div class="util"><a class="ar">العربية</a><a>Member login</a><a class="cta">Join the society</a></div><div id="m"></div></div>
<script>
const D=window.D,P=window.PAGE;const m=D.members;
const titles={home:['The Society','Saudi Society of Colon & Rectal Surgery'],board:['Leadership','Board Members'],about:['Since 2009','About the Society'],membership:['Membership','Join the Society'],committees:['Governance','Committees & Regulations']};
const navs=[['about','About','01'],['board','Board','02'],['membership','Membership','03'],['committees','Committees','04'],['education','Education','05']];
document.querySelector('#L').innerHTML=`<div class="lock"><img src="assets/seal.png">Saudi Society of<br>Colon &amp; Rectal Surgery</div>
${P==='home'?`<div class="vnav">${navs.map(n=>`<a><i>${n[2]}</i>${n[1]}</a>`).join('')}</div>`:`<div class="title"><small>${titles[P][0]}</small>${titles[P][1]}</div>`}
<div class="bot"><div>Est. 2009 · 1430H<br>Riyadh, Saudi Arabia</div><div class="ar">الجمعية السعودية لجراحة القولون والمستقيم</div></div>`;
const T={
home:`<div class="hero"><h1>The national home for colorectal surgical excellence.</h1><p>Education, research and public awareness — organised by the surgeons of the Kingdom, since 2009.</p><a class="btn">Become a member</a> &nbsp; <a class="btn o">About the society</a></div>
<div class="entries"><div class="e"><div class="d">15–17 April</div><div><h4>SSCRS Annual Forum 2026 — registration is open</h4><p>Three days of lectures, live surgery and workshops in Riyadh.</p></div><a class="a">Register →</a></div><div class="e"><div class="d">28 March</div><div><h4>New colorectal cancer screening guidelines</h4><p>In partnership with the Ministry of Health.</p></div><a class="a">Read →</a></div><div class="e"><div class="d">10 March</div><div><h4>Fellowship applications open for 2026</h4><p>Advanced laparoscopic fellowship programme.</p></div><a class="a">Apply →</a></div></div>`,
board:`<div class="ph"><p>The society is guided by distinguished surgeons and healthcare leaders from across Saudi Arabia.</p></div>
<div class="chair"><img src="${m[0].img}"><div><div class="r">${m[0].r}</div><h2>${m[0].n}</h2><p>${m[0].bio}</p><p style="margin-top:8px;color:var(--ink)">${m[0].i}</p></div></div>
${m.slice(1).map(x=>`<div class="mem"><img src="${x.img}"><div><h4>${x.n}</h4><div class="t">${x.t} · ${x.i}</div></div><a class="a" style="font-size:14px;font-weight:600">Profile →</a></div>`).join('')}`,
about:`<div class="ph"><p>Founded by decree of the Saudi Commission for Health Specialties, SSCRS was established to organize scientific work, strengthen professional fellowship, and elevate public awareness of colorectal health.</p></div>
<div class="about"><div><h2 class="fr" style="font-size:44px">Four pillars</h2><div class="pill">${D.pillars.map(p=>`<div>${p[0]}</div>`).join('')}</div></div><img src="assets/seal.png"></div>
<div class="stats">${D.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>`,
membership:`<div class="ph"><p>Three categories under the Basic Bylaw. Choose the one that matches your stage.</p></div>
<div class="tiers">${D.tiers.map((t,i)=>`<div class="tier${i==1?' hl':''}"><h3>${t[0]}</h3><div class="pr">${t[2]}</div><div class="per">${t[3]}</div><ul>${t[4].map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn${i==1?'':' o'}" style="margin-top:20px;height:42px">Apply</a></div>`).join('')}</div>`,
committees:`<div class="ph"><p>Under Chapter 5 of the Basic Bylaw, the Board and the General Assembly may form standing or temporary committees.</p></div>
<div class="entries" style="margin-top:0">${D.coms.map((c,i)=>`<div class="e"><div class="d">0${i+1}</div><div><h4>${c[0]}</h4><p>${c[3]} · ${c[2]}</p></div><a class="a">Chair TBA</a></div>`).join('')}</div>
<h2 class="fr" style="font-size:40px;margin:48px 0 10px">Regulations library</h2>
<div class="entries" style="margin-top:0">${D.docs.map(d=>`<div class="e"><div class="d">${d[2]}</div><h4>${d[0]}</h4><a class="a">Download ↓</a></div>`).join('')}</div>`};
document.querySelector('#m').innerHTML=T[P];
</script></body></html>
